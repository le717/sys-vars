[project]
name = "sys-vars"
version = "6.0.0a1"
description = "Access system variables in your code as native Python data types."
readme = "README.md"
authors = [{ name = "Caleb", email = "le717@users.noreply.github.com" }]
license = "MIT"
# TODO: urls
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Version Control :: Git",
  "Typing :: Typed",
]

requires-python = ">=3.14"
dependencies = []

[project.urls]
homepage = "https://github.com/le717/sys-vars"
source = "https://github.com/le717/sys-vars.git"

[dependency-groups]
dev = ["ruff>=0.17.6", "ty>=0.0.111"]
dotenv = ["python-dotenv>=1.2.4"]

[tool.ruff]
line-length = 100
indent-width = 4
extend-exclude = ["tests"]

[tool.ruff.lint]
preview = true

ignore = [
  "missing-trailing-comma",  # missing-trailing-comma
  "no-self-use",             # no-self-use
  "useless-return",          # useless-return
  "unnecessary-return-none", # unnecessary-return-none
  "missing-todo-author",     # missing-todo-author
  "missing-todo-link",       # missing-todo-link
]

select = [
  "A",    # flake8-builtins
  "ARG",  # flake8-unused-arguments
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "C90",  # mccabe
  "COM",  # flake8-commas
  "DTZ",  # flake8-datetimez
  "EM",   # flake8-errmsg
  "ERA",  # eradicate
  "F",    # pyflakes
  "FIX",  # flake8-fixme
  "FLY",  # flynt
  "FURB", # refurb
  "I",    # isort
  "LOG",  # flake8-logging
  "G",    # flake8-logging-format
  "PERF", # Perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "T20",  # flake8-print
  "TD",   # flake8-todos
  "UP",   # pyupgrade
]

[tool.ruff.format]
preview = true
indent-style = "space"
quote-style = "double"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
lines-after-imports = 2
